# Legato for iPhone. `xcodegen generate` writes Legato.xcodeproj from this;
# run scripts/build-core.sh first, since the app links the core it builds.
name: Legato

options:
  bundleIdPrefix: tech.abhashchakraborty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  LegatoCore:
    path: LegatoCore

targets:
  Legato:
    type: application
    platform: iOS
    sources:
      - path: Legato
    dependencies:
      - package: LegatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.abhashchakraborty.legato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Legato/Info.plist
      properties:
        CFBundleDisplayName: Legato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Figtree.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Sync is a socket straight to the PC on the same network.
        NSLocalNetworkUsageDescription: Legato connects to your PC on your network to sync your Dictionary, snippets, dictations and notes.
        # legato://pair?… from the PC's pairing code or Copy link.
        CFBundleURLTypes:
          - CFBundleURLName: tech.abhashchakraborty.legato.pair
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - legato

  # The core on its own, without the app around it: these run as a plain
  # test bundle in the simulator.
  LegatoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LegatoCoreTests
      - path: Legato/Theme.swift
      - path: Legato/Vault.swift
      - path: Legato/Wording.swift
      - path: Legato/Resources/Figtree.ttf
    dependencies:
      - package: LegatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.abhashchakraborty.legato.coretests
        GENERATE_INFOPLIST_FILE: YES

  LegatoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LegatoUITests
    dependencies:
      - target: Legato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.abhashchakraborty.legato.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Legato:
    build:
      targets:
        Legato: all
        LegatoCoreTests: [test]
        LegatoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LegatoCoreTests
        - LegatoUITests
    archive:
      config: Release
