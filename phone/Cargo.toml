# The phone side of Legato, kept out of the app's build: the shared library,
# the stand-in CLI and the Android bindings.
[workspace]
resolver = "2"
members = ["core", "android", "bindgen"]

[profile.release]
opt-level = 3
lto = "thin"
# No strip here: uniffi-bindgen reads its metadata from the symbols of the
# built library; cargo-ndk strips the copy that goes into the APK.
