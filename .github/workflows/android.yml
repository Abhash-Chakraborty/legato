name: android

# Legato for Android: the Rust core for arm64 through cargo-ndk, the Kotlin
# bindings from UniFFI, then the app with Gradle. Runs on x86-64 Linux because
# Google ships the Android build tools for that alone.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "phone/**"
      - "src-tauri/src/sync/**"
      - "src-tauri/src/managers/history_store.rs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "phone/**"
      - "src-tauri/src/sync/**"
  workflow_dispatch:
  # The release workflow builds the APK it attaches to the release here.
  workflow_call:

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust for arm64 Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: phone

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust core for arm64
        working-directory: phone
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cargo ndk --target arm64-v8a --platform 29 \
            --output-dir ../android/app/src/main/jniLibs \
            build --release -p legato-android

      - name: Android's C++ runtime next to the core
        # The core links libc++_shared.so (the speech engine is C++), and the
        # app has to ship it; cargo-ndk doesn't copy it on its own.
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Kotlin bindings
        working-directory: phone
        run: |
          cargo run --release -p uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/liblegato_android.so \
            --language kotlin --no-format \
            --out-dir ../android/app/build/generated/uniffi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # One signing key for every test build, so a new APK installs over the
      # last one and keeps its pairing. Without the secret (a fork), Gradle's
      # own debug key signs it.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/legato-debug.p12"
            echo "LEGATO_KEYSTORE=$RUNNER_TEMP/legato-debug.p12" >> "$GITHUB_ENV"
          fi

      - name: Build the debug and release APKs
        working-directory: android
        env:
          LEGATO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease

      # The release APK under the name GitHub Releases carries, and
      # legato-android.json beside it: what the app's update check reads.
      - name: Release APK and its manifest
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' "$GRADLE")
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$GRADLE")
          mkdir -p dist
          APK="Legato-android-$NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          SHA=$(sha256sum "dist/$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "dist/$APK")
          URL="https://github.com/${{ github.repository }}/releases/latest/download/$APK"
          printf '{"versionName":"%s","versionCode":%s,"apk":"%s","sha256":"%s","size":%s}\n' \
            "$NAME" "$CODE" "$URL" "$SHA" "$SIZE" > dist/legato-android.json
          cat dist/legato-android.json

      - name: Tests on the host
        working-directory: phone
        run: cargo test --release -p legato-phone

      - uses: actions/upload-artifact@v4
        with:
          name: legato-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: legato-android
          path: dist/*
          if-no-files-found: error
