name: "Main Branch Build"

# Runs the Windows x64 and ARM64 builds on every push to main so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on main has a downloadable, testable build. They are unsigned
# until Legato has its own code-signing certificate: the config override drops
# the custom signCommand and the updater artifacts, as in the test build.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: >-
        ${{ matrix.args }}
        --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
