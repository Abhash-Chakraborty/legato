name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const version = '${{ steps.get-version.outputs.version }}'
            // Notes written for the release, else GitHub's list of changes.
            const file = `.github/release-notes/${version}.md`
            const body = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : undefined
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              // The tag is made when the draft is published; pin it to the
              // commit built here, not wherever the branch has moved since.
              target_commitish: context.sha,
              name: `Legato ${version}`,
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: body === undefined
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "legato"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  android:
    # Legato for Android, signed with the key every earlier APK used.
    needs: create-release
    uses: ./.github/workflows/android.yml
    secrets: inherit

  attach-android:
    # The APK and legato-android.json on the draft, where the app's update
    # check finds them under releases/latest.
    needs: [create-release, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legato-android
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.create-release.outputs.version }}" dist/* --clobber -R "${{ github.repository }}"

  publish-release:
    # Publishes the draft once the installers and the APK are on it. The
    # release environment lists each one under Deployments, linked to its page.
    needs: [create-release, publish-tauri, attach-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Publish the draft
        id: publish
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
              make_latest: 'true'
            })
            core.setOutput('url', data.html_url)

  winget:
    # Sends the new version to winget-pkgs as a pull request from the
    # owner's fork. Needs a classic token with public_repo in WINGET_TOKEN;
    # without one the job is skipped.
    needs: [create-release, publish-release]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Open the winget-pkgs pull request
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: abhashchakraborty.legato
          version: ${{ needs.create-release.outputs.version }}
          release-tag: v${{ needs.create-release.outputs.version }}
          installers-regex: '\.(exe|msi)$'
          token: ${{ secrets.WINGET_TOKEN }}
